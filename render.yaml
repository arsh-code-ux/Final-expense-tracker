services:
  - type: web
    name: track-expense-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://track-expense-frontend.onrender.com
      - key: APP_NAME
        value: TrackExpense
      - key: APP_VERSION
        value: 1.0.0
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: track-expense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://track-expense-backend.onrender.com
      - key: VITE_APP_NAME
        value: Track Expense
      - key: VITE_APP_VERSION
        value: 1.0.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html